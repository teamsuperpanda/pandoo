name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_android:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - name: Verify tag matches pubspec version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          version_name="${version%%+*}"
          echo "tag=$tag pubspec=$version (name $version_name)"
          if [ "$tag" != "$version_name" ]; then
            echo "::error::Tag v$tag does not match pubspec version $version"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib/ test/

      - name: Run flutter analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build App Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STOREPASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STOREPASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Rename artifacts
        run: |
          set -euo pipefail
          version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/pandoo-${version}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/pandoo-${version}.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
