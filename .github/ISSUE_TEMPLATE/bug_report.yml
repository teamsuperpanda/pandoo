name: Bug report
description: Something does not work as expected
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem use the private reporting
        link in SECURITY.md instead of a public issue.
  - type: input
    id: version
    attributes:
      label: App version and build
      description: Shown in Settings > About. For example 2.5.0+14.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      description: For example Android 15 or iOS 18.2.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data safety
      options:
        - label: I lost data or saw corrupted data because of this bug
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any logs. Remove anything private first.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security issue (those go through SECURITY.md)
          required: true
