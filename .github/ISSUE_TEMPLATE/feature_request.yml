name: Feature request
description: Suggest an improvement
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the app makes hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: offline
    attributes:
      label: Does this work fully offline?
      options:
        - "Yes - no network needed"
        - "No - it needs a network or a service"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Does it collect, transmit or store any new data? If yes, where and why?
      placeholder: "No new data leaves the device."
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I checked ROADMAP.md and this is not already planned
          required: true
